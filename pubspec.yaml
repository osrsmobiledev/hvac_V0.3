name: hvac_app
description: "Offline-first HVAC Field Service app for Flemish technicians."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.3.3+1
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true

  fonts:
    - family: Libron
      fonts:
        - asset: assets/fonts/libron-regular.ttf
        - asset: assets/fonts/libron-bold.ttf
          weight: 700
        - asset: assets/fonts/libron-italic.ttf
          style: italic
        - asset: assets/fonts/libron-boldItalic.ttf
          weight: 700
          style: italic
